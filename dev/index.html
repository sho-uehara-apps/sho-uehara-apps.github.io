<title>キャリアグラフ（開発版）</title>

<meta name="theme-color" content="#14181c" media="(prefers-color-scheme: dark)">

<style>/*
 * キャリアグラフ 画面の見た目
 * 落ち着いた配色と情報密度（進捗管理表ツールから引き継ぐもの）。色は変数にまとめ、ダークモードで入れ替える。
 * スマホ（幅 760px 以下）では、クイック入力を「＋ 記録する」から全画面で開く。
 */

:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f2f4;
  --text: #1c2227;
  --muted: #5b6670;
  --border: #dde2e6;
  --accent: #1f5f6b;
  --accent-text: #ffffff;
  --accent-soft: #e4eff1;
  --chip: #eceff2;
  --chip-on: #1f5f6b;
  --chip-on-text: #ffffff;
  --info-bg: #eaf2f4;
  --info-border: #c3dbe0;
  --warn-text: #7a4a00;
  --warn-bg: #fff6df;
  --warn-border: #efd9a2;
  --danger-text: #9f241a;
  --danger-bg: #fdeeec;
  --danger-border: #f0c4bf;
  --inbox-bg: #fff1d6;
  --inbox-text: #7a4a00;
  --dev-bg: #8a4b08;
  --focus: #2f7f8c;
  --shadow: 0 1px 2px rgba(20, 30, 40, 0.06), 0 2px 8px rgba(20, 30, 40, 0.05);
  --radius: 8px;
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181c;
    --surface: #1b2126;
    --surface-2: #222a30;
    --text: #e3e7ea;
    --muted: #9aa5ae;
    --border: #2f383f;
    --accent: #6db3be;
    --accent-text: #0f1a1d;
    --accent-soft: #1d3135;
    --chip: #262e35;
    --chip-on: #6db3be;
    --chip-on-text: #0f1a1d;
    --info-bg: #172a2e;
    --info-border: #2b4a50;
    --warn-text: #f0c46c;
    --warn-bg: #2b2414;
    --warn-border: #574722;
    --danger-text: #f2a097;
    --danger-bg: #321b19;
    --danger-border: #5c2e29;
    --inbox-bg: #3a2e14;
    --inbox-text: #f0c46c;
    --dev-bg: #b86a12;
    --focus: #8fd0da;
    --shadow: none;
    color-scheme: dark;
  }
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

[hidden] {
  display: none !important;
}

h1,
h2,
h3 {
  line-height: 1.35;
  margin: 0;
}

p {
  margin: 0;
}

.muted {
  color: var(--muted);
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* ---------- ボタン・入力 ---------- */

.btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 6px;
  padding: 7px 14px;
  font: inherit;
  font-size: 14px;
  line-height: 1.4;
  cursor: pointer;
  white-space: nowrap;
}

.btn:hover {
  background: var(--surface-2);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
}

.btn-primary:hover {
  background: var(--accent);
  filter: brightness(1.08);
}

.btn-danger {
  color: var(--danger-text);
  border-color: var(--danger-border);
}

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--muted);
}

.btn-small {
  padding: 4px 10px;
  font-size: 13px;
}

/* ファイルを選ぶボタン（ラベルをボタンの形にし、中のファイル選択の欄は見えなくする。キーボードでは欄にフォーカスが当たる） */
.file-button {
  display: inline-block;
  position: relative;
}

.file-button:focus-within {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  padding: 8px 10px;
  font: inherit;
  font-size: 16px; /* iPhone で入力時に画面が拡大されないよう、16px 以上にする */
  line-height: 1.5;
}

textarea.input {
  resize: vertical;
  min-height: 4.5em;
}

.input[aria-invalid="true"] {
  border-color: var(--danger-text);
}

.label,
.field > label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 4px;
}

.hint {
  font-size: 12px;
  color: var(--muted);
}

.field {
  margin-bottom: 12px;
}

.date-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.input-date {
  max-width: 13em;
}

.form-error {
  color: var(--danger-text);
  font-size: 14px;
  margin-bottom: 10px;
}

.form-blocked {
  color: var(--danger-text);
  font-size: 14px;
  margin-bottom: 10px;
}

/* ---------- チップ・バッジ ---------- */

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  display: inline-block;
  border-radius: 999px;
  background: var(--chip);
  color: var(--text);
  font-size: 12px;
  line-height: 1.5;
  padding: 1px 9px;
  border: 1px solid transparent;
}

.chip-toggle {
  appearance: none;
  font: inherit;
  font-size: 14px;
  padding: 4px 12px;
  cursor: pointer;
  border-color: var(--border);
  background: var(--surface);
}

.chip-toggle[aria-pressed="true"] {
  background: var(--chip-on);
  border-color: var(--chip-on);
  color: var(--chip-on-text);
}

.badge {
  display: inline-block;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
  padding: 0 6px;
}

.badge-inbox {
  background: var(--inbox-bg);
  color: var(--inbox-text);
}

.badge-dev {
  background: var(--dev-bg);
  color: #ffffff;
}

/* ---------- ヘッダー ---------- */

.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 16px;
  padding: 8px 16px;
  padding-top: calc(8px + env(safe-area-inset-top));
  padding-left: calc(16px + env(safe-area-inset-left));
  padding-right: calc(16px + env(safe-area-inset-right));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.header-top {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1 1 auto;
  min-width: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 16px;
  white-space: nowrap;
}

.save-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
}

.save-status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #3f9b5a;
}

.save-status.is-pending .dot {
  background: #c49320;
}

.save-status.is-error {
  color: var(--danger-text);
  font-weight: 600;
}

.save-status.is-error .dot {
  background: var(--danger-text);
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}

.export-age {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
}

.export-age.is-warn {
  color: var(--warn-text);
  font-weight: 600;
}

/* ---------- 本体 ---------- */

.app-main {
  max-width: 920px;
  margin: 0 auto;
  padding: 16px;
  padding-left: calc(16px + env(safe-area-inset-left));
  padding-right: calc(16px + env(safe-area-inset-right));
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}

/* ---------- お知らせ ---------- */

.notices {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.notices:not(:empty) {
  margin-bottom: 16px;
}

.notice {
  border: 1px solid var(--info-border);
  background: var(--info-bg);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 14px;
}

.notice-warn {
  border-color: var(--warn-border);
  background: var(--warn-bg);
}

.notice-error {
  border-color: var(--danger-border);
  background: var(--danger-bg);
  color: var(--danger-text);
}

.notice-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.report {
  margin-top: 6px;
  font-size: 13px;
  color: var(--text);
}

.report summary {
  cursor: pointer;
  color: var(--muted);
}

.report-list {
  margin: 6px 0 0;
  padding-left: 0;
  list-style: none;
  max-height: 16em;
  overflow: auto;
}

.report-item {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 8px;
  padding: 3px 0;
  border-top: 1px solid var(--border);
}

.report-level {
  font-weight: 600;
  min-width: 3.5em;
}

.level-error .report-level,
.level-drop .report-level {
  color: var(--danger-text);
}

.report-before {
  color: var(--muted);
  flex-basis: 100%;
  font-size: 12px;
}

/* ---------- クイック入力 ---------- */

.qi-sheet {
  margin-bottom: 20px;
}

.quick-input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px 12px;
}

.qi-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.qi-heading {
  font-size: 15px;
}

.qi-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ---------- 経験の一覧 ---------- */

.list-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 8px;
}

.list-title {
  font-size: 16px;
}

.list-count {
  color: var(--muted);
  font-size: 13px;
}

.exp-list {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.exp-item + .exp-item {
  border-top: 1px solid var(--border);
}

.exp-body {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 14px;
  background: transparent;
  border: 0;
  color: inherit;
  font: inherit;
}

button.exp-body {
  cursor: pointer;
}

button.exp-body:hover {
  background: var(--surface-2);
}

.exp-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  font-size: 13px;
  color: var(--muted);
}

.exp-date {
  font-variant-numeric: tabular-nums;
}

.exp-date.is-empty {
  font-style: italic;
}

.exp-title {
  display: block;
  font-weight: 600;
  margin-top: 2px;
}

.exp-title.is-untitled {
  font-weight: 400;
}

.exp-memo {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  white-space: pre-wrap;
  color: var(--muted);
  font-size: 14px;
  margin-top: 2px;
}

.exp-item.is-open .exp-memo {
  display: block;
  -webkit-line-clamp: unset;
}

.empty {
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
}

/* ---------- 重ねて開く画面（データ） ---------- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(10, 15, 20, 0.45);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 16px;
  padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
    calc(16px + env(safe-area-inset-left));
  overflow: auto;
}

.panel {
  width: 100%;
  max-width: 560px;
  background: var(--surface);
  color: var(--text);
  border-radius: 10px;
  padding: 14px 16px 18px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.panel-head h2 {
  font-size: 19px;
}

.panel-section {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
}

.panel-section h3 {
  font-size: 14px;
}

.quarantine-list {
  list-style: none;
  margin: 0;
  padding: 0;
  width: 100%;
}

.quarantine-list li {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
  padding: 6px 0;
  border-top: 1px solid var(--border);
}

.q-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

/* 狭い画面では、ボタンを説明の下に回す */
.q-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1 1 12em;
}

.q-reason {
  font-weight: 600;
  font-size: 14px;
}

.q-meta,
.q-message {
  font-size: 12px;
  color: var(--muted);
}

.q-total {
  font-size: 13px;
  color: var(--muted);
}

.q-total.is-warn {
  color: var(--warn-text);
  font-weight: 600;
}

.plain-list {
  margin: 0;
  padding-left: 1.2em;
}

/* ---------- 取り込みの画面・復元 ---------- */

.import-summary {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 4px;
}

.import-error {
  font-weight: 600;
  color: var(--danger-text);
}

.import-warn {
  width: 100%;
  color: var(--warn-text);
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.import-change {
  font-size: 14px;
}

.import-confirm {
  width: 100%;
  background: var(--danger-bg);
  border: 1px solid var(--danger-border);
  border-radius: 6px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 14px;
}

.import-confirm-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn-danger-strong {
  background: var(--danger-text);
  border-color: var(--danger-text);
  color: var(--surface);
  font-weight: 600;
}

.btn-danger-strong:hover {
  background: var(--danger-text);
  filter: brightness(1.08);
}

.import-status {
  margin-top: 12px;
  font-size: 14px;
}

.import-status.is-error {
  font-weight: 600;
  color: var(--danger-text);
}

.import-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
}

.recovery-restore {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ---------- 読み込めないときの画面 ---------- */

.recovery {
  max-width: 640px;
  margin: 0 auto;
  padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
    calc(16px + env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.recovery h1 {
  font-size: 20px;
}

.recovery-lead {
  font-weight: 600;
  color: var(--danger-text);
}

.recovery-help li + li {
  margin-top: 4px;
}

.recovery-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.recovery-status {
  font-size: 14px;
}

/* ---------- トースト・記録ボタン ---------- */

.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(80px + env(safe-area-inset-bottom));
  z-index: 40;
  background: #23292e;
  color: #ffffff;
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 14px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  width: max-content;
  max-width: calc(100vw - 32px);
}

.fab {
  position: fixed;
  right: calc(16px + env(safe-area-inset-right));
  bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 20;
  appearance: none;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-text);
  font: inherit;
  font-weight: 700;
  font-size: 16px;
  padding: 13px 22px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
  cursor: pointer;
}

/* ---------- 幅による出し分け ---------- */

@media (min-width: 761px) {
  .only-narrow,
  .qi-close {
    display: none !important;
  }
  .app-main {
    padding-bottom: 32px;
  }
}

@media (max-width: 760px) {
  .only-wide {
    display: none !important;
  }
  .app-header {
    padding-top: calc(6px + env(safe-area-inset-top));
    padding-bottom: 6px;
  }
  .header-top {
    flex-basis: 100%;
    justify-content: space-between;
  }
  .header-tools {
    flex-basis: 100%;
    justify-content: flex-end;
  }
  .header-tools .export-age {
    margin-right: auto;
  }
  .app-main {
    padding-top: 12px;
  }
  .qi-sheet {
    display: none;
    margin: 0;
  }
  .qi-sheet.is-open {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 25;
    overflow: auto;
    background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
      calc(12px + env(safe-area-inset-left));
  }
  .qi-sheet.is-open .quick-input {
    box-shadow: none;
  }
  body.sheet-open .fab {
    display: none;
  }
  body.sheet-open {
    overflow: hidden;
  }
}
</style>
</head>

const { createAutosaver } = __require("persist/autosave.js");
const { exportFileName, exportText, rawFileName } = __require("persist/export.js");
const { describeChange, liveCountText, prepareImport } = __require("persist/import.js");
const { QUARANTINE_MAX_CHARS, REASONS, reasonLabel } = __require("persist/local.js");
const { quickAddExperience } = __require("store/actions.js");
const { reduce } = __require("store/reducer.js");
const { experienceCounts, exportAge, firstLine, formatPartialDate } = __require("store/selectors.js");
const { createStore } = __require("store/store.js");
const { CHANNEL_LABELS } = __require("ui/build-info.js");
const { h, setChildren } = __require("ui/dom.js");
const { isStandalone, localDateTimeText, localDayOf, localTimeText, requestPersistence } = __require("ui/env.js");
const { deliverTextFile, readFileText } = __require("ui/files.js");
const { openDataPanel } = __require("ui/views/data-panel.js");
const { renderExperienceList } = __require("ui/views/experience-list.js");
const { openImportPanel } = __require("ui/views/import-panel.js");
const { createQuickInput } = __require("ui/views/quick-input.js");
const { reportDetails } = __require("ui/views/report.js");

const SAVE_STATUS = Object.freeze({
  idle: ["ok", "保存済み"],
  saved: ["ok", "保存済み"],
  pending: ["pending", "保存待ち…"],
  error: ["error", "保存できません"],
  blocked: ["error", "保存を止めています"],
});

/** 保存し直さなくてよい置き換え（保存前チェックで直した・別の画面の保存を読み直した・記録を取り消した） */
const QUIET_REPLACE = new Set(["repaired", "external", "rollback"]);

const DRAFT_DELAY = 400;

/**
 * @param {HTMLElement} root
 * @param {{
 *   data: object, env: object, persistence: object, build: {channel:string, commit:string, builtAt:string}, win: Window,
 *   load?: object|null,           起動時の読み込みの結果（お知らせを出すため）
 *   notices?: object[],           最初に出すお知らせ
 *   saveNow?: boolean,            始めてすぐに保存する（読み込めなかったデータの代わりに使うとき）
 * }} opts
 */
function startApp(root, { data, env, persistence, build, win, load = null, notices = [], saveNow = false }) {
  const doc = win.document;
  const store = createStore(data, { reduce });
  const blockedAtStart = persistence.blocked();
  const ui = {
    notices: [],
    save: blockedAtStart ? { status: "blocked", message: blockedAtStart.message, at: null } : { status: "idle", message: "", at: null },
    dirtyIsQuarantined: false,
    draftFailed: false,
    prefs: persistence.readPrefs(),
    expanded: new Set(),
    protection: null,
    panel: null,
    importPanel: null,
  };
  let noticeSeq = 0;
  let toastTimer = null;
  let draftTimer = null;
  /** このタブの目印（書きかけを、どのタブが書いたかを見分ける） */
  const tabId = env.newId("tab");

  /* ---------- 骨組み ---------- */

  const header = h("header", { class: "app-header" });
  const noticesEl = h("div", { class: "notices" });
  const listEl = h("section", { class: "exp-section", "aria-label": "経験の一覧" });
  const toastEl = h("div", { class: "toast", role: "status", "aria-live": "polite", hidden: true });
  const quick = createQuickInput({
    categories: data.settings.lists.categories,
    today: () => env.today(),
    onSubmit: submitQuick,
    onClose: closeQuick,
    onChange: scheduleDraft,
  });
  const sheet = h("section", { class: "qi-sheet", "aria-label": "クイック入力" }, quick.el);
  const fab = h("button", { type: "button", class: "fab only-narrow", onclick: openQuick }, "＋ 記録する");
  setChildren(root, header, h("main", { class: "app-main" }, noticesEl, sheet, listEl), fab, toastEl);

  /* ---------- 保存 ---------- */

  const autosaver = createAutosaver({
    save: () => persistence.save(store.getData()),
    onResult: onSaveResult,
    setTimer: (fn, ms) => win.setTimeout(fn, ms),
    clearTimer: (t) => win.clearTimeout(t),
  });

  function onSaveResult(r) {
    if (r.ok) {
      ui.save = { status: "saved", message: "", at: r.savedAt };
      removeNotice("save");
      if (r.repaired) {
        store.dispatch({ type: "data/replace", data: r.repaired.data, reason: "repaired" });
        addNotice({
          key: "repaired",
          level: "warn",
          text: `保存前チェックで、${r.repaired.report.items.length}件を直してから保存しました。`,
          details: r.repaired.report.items,
          dismissible: true,
        });
      }
      if (r.restored) {
        addNotice({ key: "restored", level: "warn", text: "保存データが消えていたので、画面の内容で保存し直しました。", dismissible: true });
      }
    } else {
      ui.save = { status: persistence.blocked() ? "blocked" : "error", message: r.message, at: null };
      if (r.quarantined !== undefined) ui.dirtyIsQuarantined = r.quarantined === true;
      // 止めたあとの保存の試みでは、最初の知らせ（退避できたかどうかを含む）をそのまま残す
      const keepFirst = r.blocked === true && ui.notices.some((n) => n.key === "save");
      if (!keepFirst) addNotice(saveFailureNotice(r));
    }
    renderHeader();
    renderBlocked();
  }

  function saveFailureNotice(r) {
    const reload = { label: "再読み込み", run: () => win.location.reload() };
    const exp = { label: "JSON Export", run: doExport };
    if (r.code === "conflict" || r.code === "newerVersion") {
      if (r.quarantined === false) {
        return {
          key: "save",
          level: "error",
          text: `${r.message}。この画面の内容は退避もできなかったため、画面の中にしかありません。先に JSON Export してから、再読み込みしてください。`,
          actions: [{ ...exp, primary: true }, reload],
        };
      }
      return {
        key: "save",
        level: "error",
        text: `${r.message}。この画面の内容は退避しました（「データ」からダウンロードできます）。再読み込みすると、別の画面で保存された内容を開きます。`,
        actions: [{ ...reload, primary: true }, exp],
      };
    }
    if (r.code === "quota") {
      return {
        key: "save",
        level: "error",
        text: `${r.message}。「データ」で古い退避データをダウンロードしてから削除すると、空きができます。`,
        actions: [{ ...exp, primary: true }, { label: "データを開く", run: openPanel }],
      };
    }
    return { key: "save", level: "error", text: r.message, details: r.report ? r.report.items : null, actions: [{ ...exp, primary: true }] };
  }

  /** クイック入力に出しているカテゴリの選択肢（取り込みや、別の画面の保存の読み直しで変わったら出し直す） */
  let shownCategories = JSON.stringify(data.settings.lists.categories);

  store.subscribe((next, action) => {
    if (!(action.type === "data/replace" && QUIET_REPLACE.has(action.reason))) {
      ui.dirtyIsQuarantined = false;
      if (!persistence.blocked()) ui.save = { status: "pending", message: "", at: null };
      autosaver.schedule();
    }
    const cats = JSON.stringify(next.settings.lists.categories);
    if (cats !== shownCategories) {
      shownCategories = cats;
      quick.setCategories(next.settings.lists.categories);
    }
    renderList();
    renderHeader();
  });

  /* ---------- クイック入力の書きかけ ----------
   * 書きかけのキーは、同じ版のタブすべてで1つ。消してよいのは、このタブが書いた（または引き継いだ）書きかけだけ
   * （PC で複数のタブを開いているとき、空のタブを閉じただけで、別のタブの書きかけを消さないため）。
   */

  function scheduleDraft() {
    win.clearTimeout(draftTimer);
    draftTimer = win.setTimeout(saveDraft, DRAFT_DELAY);
  }

  function showDraftWarning() {
    quick.setDraftWarning(ui.draftFailed ? "書きかけを保存できません（保存領域がいっぱいの可能性があります）。このまま閉じると、入力は消えます。" : null);
  }

  function writeOwnDraft() {
    const r = persistence.writeDraft({ ...quick.getValues(), at: env.now(), tabId });
    ui.draftFailed = !r.ok;
    showDraftWarning();
  }

  /** このタブが書いた書きかけなら消す */
  function discardOwnDraft() {
    const stored = persistence.readDraft();
    if (stored && stored.tabId === tabId) persistence.writeDraft(null);
    ui.draftFailed = false;
    showDraftWarning();
  }

  function saveDraft() {
    win.clearTimeout(draftTimer);
    draftTimer = null;
    if (quick.hasInput()) writeOwnDraft();
    else discardOwnDraft();
  }

  /* ---------- 画面の出入り ---------- */

  win.addEventListener("pagehide", () => {
    saveDraft();
    autosaver.flush();
  });
  // Chrome がタブを凍結・破棄する前（pagehide が来ないことがある）
  doc.addEventListener("freeze", () => {
    saveDraft();
    autosaver.flush();
  });
  doc.addEventListener("visibilitychange", () => {
    if (doc.visibilityState === "hidden") {
      saveDraft();
      autosaver.flush();
    } else {
      // 開いたまま日付をまたいだときのため
      quick.refreshDate();
      renderHeader();
    }
  });
  win.addEventListener("beforeunload", (ev) => {
    saveDraft();
    autosaver.flush();
    const unsavedData = autosaver.isDirty() && !ui.dirtyIsQuarantined;
    if (unsavedData || ui.draftFailed) {
      ev.preventDefault();
      ev.returnValue = "";
    }
  });

  /** 別の画面（タブ）が書きかけを消したとき: こちらの入力が、消された書きかけと同じなら、記録されたものとして空にする */
  function onDraftRemovedElsewhere(oldValue) {
    let old = null;
    try {
      old = JSON.parse(oldValue || "null");
    } catch {
      old = null;
    }
    if (!old || typeof old !== "object" || !quick.hasInput()) return;
    const v = quick.getValues();
    const cats = Array.isArray(old.categories) ? old.categories : [];
    const same =
      v.title === old.title &&
      v.memo === old.memo &&
      v.categories.length === cats.length &&
      v.categories.every((c) => cats.includes(c));
    if (same) {
      quick.clear();
      removeNotice("draft");
      toast("別の画面（タブ）で記録されたので、書きかけを空にしました");
    }
  }

  // 別の画面（タブ）が保存したとき
  win.addEventListener("storage", (ev) => {
    if (ev.key === persistence.keys.draft) {
      if (ev.newValue === null) onDraftRemovedElsewhere(ev.oldValue);
      return;
    }
    if (ev.key !== null && ev.key !== persistence.keys.data) return;
    if (persistence.blocked()) return;
    if (autosaver.isDirty()) {
      // こちらにも未保存の変更がある。保存しようとすれば食い違いとして止まり、こちらの内容は退避される
      autosaver.flush();
      return;
    }
    const r = persistence.load();
    if (r.kind === "ok") {
      store.dispatch({ type: "data/replace", data: r.data, reason: "external" });
      ui.save = { status: "idle", message: "", at: null };
      showLoadNotices(r);
      toast("別の画面（タブ）で保存された内容を読み込みました");
    } else if (r.kind === "empty") {
      // 保存データが消された。画面の内容で保存し直す
      autosaver.schedule();
      autosaver.flush();
    } else {
      ui.save = { status: "blocked", message: r.message || r.error.message, at: null };
      addNotice({
        key: "save",
        level: "error",
        text: `別の画面（タブ）で保存されたデータを読み込めません（${r.kind === "error" ? r.error.message : r.message}）。再読み込みしてください。`,
        actions: [{ label: "再読み込み", primary: true, run: () => win.location.reload() }],
      });
    }
    renderHeader();
    renderBlocked();
  });

  /* ---------- お知らせ ---------- */

  function addNotice(n) {
    const notice = {
      id: ++noticeSeq,
      key: n.key || null,
      level: n.level,
      text: n.text,
      details: n.details && n.details.length > 0 ? n.details : null,
      actions: n.actions || [],
      dismissible: n.dismissible === true,
      onDismiss: n.onDismiss || null,
    };
    if (notice.key) ui.notices = ui.notices.filter((x) => x.key !== notice.key);
    ui.notices.push(notice);
    renderNotices();
  }

  function removeNotice(key) {
    const before = ui.notices.length;
    ui.notices = ui.notices.filter((x) => x.key !== key);
    if (ui.notices.length !== before) renderNotices();
  }

  function renderNotices() {
    setChildren(
      noticesEl,
      ui.notices.map((n) =>
        h(
          "div",
          { class: ["notice", `notice-${n.level}`], role: n.level === "error" ? "alert" : "status", dataset: { key: n.key || "" } },
          h("p", { class: "notice-text" }, n.text),
          n.details ? reportDetails(n.details) : null,
          n.actions.length > 0 || n.dismissible
            ? h(
                "div",
                { class: "notice-actions" },
                n.actions.map((a) => h("button", { type: "button", class: ["btn", "btn-small", a.primary && "btn-primary"], onclick: a.run }, a.label)),
                n.dismissible
                  ? h(
                      "button",
                      {
                        type: "button",
                        class: "btn btn-small btn-ghost",
                        onclick: () => {
                          ui.notices = ui.notices.filter((x) => x.id !== n.id);
                          renderNotices();
                          if (n.onDismiss) n.onDismiss();
                        },
                      },
                      "閉じる",
                    )
                  : null,
              )
            : null,
        ),
      ),
    );
  }

  function toast(text) {
    toastEl.textContent = text;
    toastEl.hidden = false;
    win.clearTimeout(toastTimer);
    toastTimer = win.setTimeout(() => {
      toastEl.hidden = true;
    }, 3500);
  }

  /* ---------- ヘッダー ---------- */

  function currentExportAge() {
    const counts = experienceCounts(store.getData());
    return exportAge(localDayOf(ui.prefs.lastExportAt), env.today(), counts.total > 0);
  }

  function renderHeader() {
    const [cls, label] = SAVE_STATUS[ui.save.status];
    const text = ui.save.status === "saved" && ui.save.at ? `${label} ${localTimeText(ui.save.at)}` : label;
    const age = currentExportAge();
    setChildren(
      header,
      h(
        "div",
        { class: "header-top" },
        h(
          "div",
          { class: "brand" },
          h("span", { class: "brand-name" }, "キャリアグラフ"),
          build.channel === "dev" ? h("span", { class: "badge badge-dev" }, "開発版") : null,
        ),
        h(
          "span",
          { class: ["save-status", `is-${cls}`], title: ui.save.message || null },
          h("span", { class: "dot", "aria-hidden": "true" }),
          text,
        ),
      ),
      h(
        "div",
        { class: "header-tools" },
        h("span", { class: ["export-age", age.warn && "is-warn"] }, age.text),
        h("button", { type: "button", class: "btn btn-small", onclick: doExport }, "JSON Export"),
        h("button", { type: "button", class: "btn btn-small", onclick: openPanel }, "データ"),
      ),
    );
  }

  function renderBlocked() {
    quick.setBlocked(persistence.blocked() ? "保存を止めているあいだは記録できません（上のお知らせを見てください）。入力は消さずに残します。" : null);
  }

  function renderList() {
    renderExperienceList(listEl, store.getData(), { expanded: ui.expanded, onAdd: openQuick });
  }

  /* ---------- クイック入力 ---------- */

  function isNarrow() {
    try {
      return Boolean(win.matchMedia && win.matchMedia("(max-width: 760px)").matches);
    } catch {
      return false;
    }
  }

  function openQuick() {
    quick.refreshDate();
    sheet.classList.add("is-open");
    doc.body.classList.add("sheet-open");
    removeNotice("draft");
    quick.focus();
  }

  function hideSheet() {
    sheet.classList.remove("is-open");
    doc.body.classList.remove("sheet-open");
  }

  /** 記録せずに閉じる（書きかけは残す） */
  function closeQuick() {
    saveDraft();
    hideSheet();
  }

  function submitQuick(values) {
    if (persistence.blocked()) {
      return { ok: false, errors: [{ field: null, message: "保存を止めているあいだは記録できません（お知らせを見てください）。" }] };
    }
    const r = quickAddExperience(values, { id: env.newId("exp"), now: env.now() });
    if (!r.ok) return r;
    const before = store.getData();
    const wasDirty = autosaver.isDirty();
    try {
      store.dispatch(r.action);
    } catch (e) {
      return { ok: false, errors: [{ field: null, message: `記録できませんでした（${e && e.message}）` }] };
    }
    const saved = autosaver.flush();
    if (!saved || !saved.ok) {
      // 保存できなかった記録は取り消し、入力を欄に残す（画面の中にしか無い記録を作らない）
      store.dispatch({ type: "data/replace", data: before, reason: "rollback" });
      if (!wasDirty) autosaver.markClean();
      renderHeader();
      return {
        ok: false,
        errors: [{ field: null, message: `記録できませんでした（${saved ? saved.message : "保存の結果が分かりません"}）。入力はそのまま残しています。` }],
      };
    }
    // 記録できたので、このタブの書きかけを消す（入力欄はこのあと quick-input が空にする）
    win.clearTimeout(draftTimer);
    draftTimer = null;
    discardOwnDraft();
    hideSheet();
    if (!isNarrow()) quick.focus();
    toast("記録しました（未整理に入れました）");
    return { ok: true };
  }

  /* ---------- Export・ダウンロード ---------- */

  function recordExport(at) {
    persistence.writePrefs({ lastExportAt: at });
    ui.prefs = persistence.readPrefs();
    renderHeader();
    refreshPanel();
  }

  function doExport() {
    const at = env.now();
    let text;
    try {
      text = exportText(store.getData(), { now: at });
    } catch (e) {
      addNotice({ key: "export", level: "error", text: `JSON Export できませんでした（${e && e.message}）`, dismissible: true });
      return;
    }
    // 共有シートは操作の直後にしか開けないので、await より前に呼ぶ
    deliverTextFile({ text, fileName: exportFileName(env.localParts(), build.channel) }, win).then((r) => {
      if (r.ok && !r.uncertain) {
        removeNotice("export");
        recordExport(at);
        toast("JSON Export しました");
      } else if (r.ok) {
        addNotice({
          key: "export",
          level: "warn",
          text: "共有の画面を開けなかったので、ダウンロードに切り替えました。ファイルが保存されたかを確かめてください（確かめるまで「最終Export」は更新しません）。",
          actions: [
            {
              label: "保存できた",
              primary: true,
              run: () => {
                removeNotice("export");
                recordExport(at);
              },
            },
          ],
          dismissible: true,
        });
      } else if (!r.cancelled) {
        addNotice({ key: "export", level: "error", text: `JSON Export できませんでした（${r.message}）`, dismissible: true });
      }
    });
  }

  function downloadRaw(raw, label) {
    const fileName = rawFileName(raw, label, env.localParts(), build.channel);
    const mime = fileName.endsWith(".json") ? "application/json" : "text/plain";
    deliverTextFile({ text: raw, fileName, mime }, win).then((r) => {
      if (!r.ok && !r.cancelled) addNotice({ key: "download", level: "error", text: `書き出せませんでした（${r.message}）`, dismissible: true });
    });
  }

  /* ---------- データ画面 ---------- */

  function protectionText() {
    const p = ui.protection;
    if (p === null) return "確かめています…";
    const backup = "端末の故障や、ブラウザのデータ削除に備えて、定期的に JSON Export してください。";
    const ios = win.navigator && typeof win.navigator.standalone === "boolean";
    const icon = ios ? "iPhone では、ホーム画面のアイコンを削除すると、そのアプリに保存したデータも消えることがあります。" : "";
    if (p.persisted) return `ブラウザに、保存データを消さないよう求めて、許可されています。${icon}${backup}`;
    if (!p.supported) return `このブラウザは、保存データを消さないよう求める仕組みに対応していません。${icon}${backup}`;
    if (isStandalone(win)) return `ブラウザに、保存データを消さないよう求めましたが、許可されていません。${icon}${backup}`;
    return `ブラウザに、保存データを消さないよう求めましたが、許可されていません。iPhone では、ホーム画面に追加して開くと許可されやすくなります。${icon}${backup}`;
  }

  function panelView() {
    const age = currentExportAge();
    const list = persistence.listQuarantine();
    return {
      exportAgeText: ui.prefs.lastExportAt ? `${age.text}（${localDateTimeText(ui.prefs.lastExportAt)}）` : age.text,
      exportWarn: age.warn,
      quarantine: list.map((e) => ({
        at: e.at,
        atText: localDateTimeText(e.at),
        reasonLabel: reasonLabel(e.reason),
        message: e.message,
        size: e.raw.length,
        keep: e.keep === true,
      })),
      quarantineTotal: list.reduce((n, e) => n + e.raw.length, 0),
      quarantineWarnAt: QUARANTINE_MAX_CHARS,
      protection: protectionText(),
      versionLines: [
        `${CHANNEL_LABELS[build.channel]}（データはこのブラウザの中に保存。普段使い用と開発用は別々）`,
        `ビルド：${build.commit}${build.builtAt ? `（${localDateTimeText(build.builtAt)}）` : ""}`,
        `データバージョン：${SCHEMA_VERSION}`,
      ],
      onExport: doExport,
      onImportFile: importFile,
      onDownloadQuarantine: (i) => {
        const e = list[i];
        if (e) downloadRaw(e.raw, `backup-${e.reason || "unknown"}`);
      },
      onImportQuarantine: (i) => {
        const e = list[i];
        if (!e) return;
        openImport({ kind: "quarantine", label: reasonLabel(e.reason), atText: localDateTimeText(e.at) }, e.raw);
      },
      onDeleteQuarantine: (i) => {
        const e = list[i];
        if (!e) return;
        if (!ask("この退避データを削除します。元に戻せません。先にダウンロードして保管しましたか？")) return;
        const r = persistence.deleteQuarantine(e.raw);
        if (!r.ok) addNotice({ key: "download", level: "error", text: r.message, dismissible: true });
        if (persistence.listQuarantine().length === 0) removeNotice("quarantine");
        refreshPanel();
      },
    };
  }

  function openPanel() {
    if (ui.panel) return;
    ui.panel = openDataPanel(root, panelView(), {
      onClose: () => {
        ui.panel = null;
      },
    });
  }

  function refreshPanel() {

 * 閉じたら、開く前に操作していた要素へフォーカスを戻す。

  ev.preventDefault();

 * @param {HTMLElement} host
 * @param {{
 *   labelledBy: string,                       見出しの id
 *   render: (view:object, close:() => void) => (Node|string|null)[],
 *   view: object,
 *   onClose?: () => void,

 * @returns {{refresh:(view:object) => void, close:() => void, el:HTMLElement}}

  const before = doc.activeElement;
  const panel = h("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-labelledby": labelledBy });
  const overlay = h(
    "div",
    {
      class: "overlay",
      onclick: (ev) => {
        if (ev.target === overlay) close();

    },
    panel,
  );

  const entry = { close };
  function close() {
    if (closed) return;
    closed = true;
    const i = stack.indexOf(entry);
